[package]
name              = "gpui_macros"
version           = "0.1.0"
edition.workspace = true
description       = "Macros used by gpui"
license           = "Apache-2.0"
publish           = false

[lib]
doctest    = true
path       = "src/gpui_macros.rs"
proc-macro = true

[dependencies]
heck.workspace        = true
proc-macro2.workspace = true
quote.workspace       = true
syn.workspace         = true

[dev-dependencies]
gpui = { workspace = true, features = ["inspector"] }

[features]
inspector = []

[lints]
workspace = true
