[package]
name              = "gpui_web"
version           = "0.1.0"
edition.workspace = true
license           = "Apache-2.0"
publish.workspace = true
autoexamples      = false

[package.metadata.cargo-shear]
ignored = ["scheduler"]

[lib]
doctest = false
path    = "src/gpui_web.rs"

[dependencies]
unicode-properties             = "=0.1.3"
unicode-script.workspace       = true
unicode-segmentation.workspace = true

[dev-dependencies]
anyhow.workspace   = true
gpui.workspace     = true
smallvec.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
anyhow.workspace                   = true
async-channel.workspace            = true
console_error_panic_hook.workspace = true
futures.workspace                  = true
gpui.workspace                     = true
gpui_wgpu.workspace                = true
http_client.workspace              = true
js-sys.workspace                   = true
log.workspace                      = true
raw-window-handle.workspace        = true
scheduler.workspace                = true
smallvec.workspace                 = true
uuid.workspace                     = true
wasm-bindgen.workspace             = true
wasm-bindgen-futures.workspace     = true
web-time.workspace                 = true

[target.'cfg(target_family = "wasm")'.dependencies.parking_lot]
workspace = true
features  = ["nightly"]

[target.'cfg(target_family = "wasm")'.dependencies.wasm_thread]
workspace = true
optional  = true

[target.'cfg(target_family = "wasm")'.dependencies.web-sys]
workspace = true
features  = [
  "Blob",
  "Clipboard",
  "ClipboardEvent",
  "ClipboardItem",
  "CompositionEvent",
  "CssStyleDeclaration",
  "DataTransfer",
  "DataTransferItem",
  "DataTransferItemList",
  "Document",
  "DomRect",
  "DragEvent",
  "Element",
  "EventTarget",
  "File",
  "FocusOptions",
  "Headers",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlTextAreaElement",
  "IdleDeadline",
  "IdleRequestOptions",
  "ImageData",
  "InputEvent",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "PointerEvent",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "ReadableStreamReadResult",
  "Request",
  "RequestCredentials",
  "RequestInit",
  "RequestRedirect",
  "ResizeObserver",
  "ResizeObserverBoxOptions",
  "ResizeObserverEntry",
  "ResizeObserverOptions",
  "ResizeObserverSize",
  "Response",
  "Screen",
  "Storage",
  "TextMetrics",
  "VisualViewport",
  "WheelEvent",
  "Window",
  "console",
]

[features]
default       = ["multithreaded"]
multithreaded = ["dep:wasm_thread", "scheduler/wasm-threads"]

[lints]
workspace = true
