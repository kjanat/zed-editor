[package]
name              = "gpui_web"
version           = "0.1.0"
edition.workspace = true
license           = "Apache-2.0"
publish.workspace = true
autoexamples      = false

[package.metadata.cargo-shear]
ignored = ["scheduler"]

[lib]
path = "src/gpui_web.rs"

[target.'cfg(target_family = "wasm")'.dependencies]
anyhow.workspace                   = true
console_error_panic_hook.workspace = true
futures.workspace                  = true
gpui.workspace                     = true
gpui_wgpu.workspace                = true
http_client.workspace              = true
js-sys.workspace                   = true
log.workspace                      = true
raw-window-handle.workspace        = true
scheduler.workspace                = true
uuid.workspace                     = true
wasm-bindgen.workspace             = true
wasm-bindgen-futures.workspace     = true
web-time.workspace                 = true

[target.'cfg(target_family = "wasm")'.dependencies.parking_lot]
workspace = true
features  = ["nightly"]

# Forked because upstream is unmaintained and its worker bootstrap still calls
# the wasm-bindgen init function with the positional arguments deprecated in 0.2.93.
[target.'cfg(target_family = "wasm")'.dependencies.wasm_thread]
git      = "https://github.com/zed-industries/wasm_thread"
rev      = "0cf96c7708dfb97ccf3da50347e25edcf75d6937"
version  = "0.3"
features = ["es_modules"]
optional = true

[target.'cfg(target_family = "wasm")'.dependencies.web-sys]
version  = "0.3"
features = [
  "Blob",
  "Clipboard",
  "ClipboardEvent",
  "ClipboardItem",
  "CompositionEvent",
  "CssStyleDeclaration",
  "DataTransfer",
  "DataTransferItem",
  "DataTransferItemList",
  "Document",
  "DomRect",
  "DragEvent",
  "Element",
  "EventTarget",
  "File",
  "Headers",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlTextAreaElement",
  "IdleDeadline",
  "IdleRequestOptions",
  "InputEvent",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MediaQueryListEvent",
  "MouseEvent",
  "Navigator",
  "PointerEvent",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "ReadableStreamReadResult",
  "Request",
  "RequestCredentials",
  "RequestInit",
  "RequestRedirect",
  "ResizeObserver",
  "ResizeObserverBoxOptions",
  "ResizeObserverEntry",
  "ResizeObserverOptions",
  "ResizeObserverSize",
  "Response",
  "Screen",
  "Storage",
  "VisualViewport",
  "WheelEvent",
  "Window",
  "console",
]

[features]
default       = ["multithreaded"]
multithreaded = ["dep:wasm_thread", "scheduler/wasm-threads"]

[lints]
workspace = true
