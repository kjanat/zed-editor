[package]
name              = "util"
version           = "0.1.0"
edition.workspace = true
description       = "A collection of utility structs and functions used by Zed and GPUI"
license           = "Apache-2.0"
publish           = false

[lib]
doctest = true
path    = "src/util.rs"

[dependencies]
anyhow.workspace             = true
async_zip.workspace          = true
collections.workspace        = true
dunce.workspace              = true
futures.workspace            = true
futures-lite.workspace       = true
globset.workspace            = true
gpui_util.workspace          = true
itertools.workspace          = true
log.workspace                = true
path                         = { workspace = true, features = ["serde"] }
percent-encoding.workspace   = true
rand                         = { workspace = true, optional = true }
regex.workspace              = true
rust-embed.workspace         = true
schemars.workspace           = true
serde.workspace              = true
serde_json.workspace         = true
serde_json_lenient.workspace = true
shlex.workspace              = true
take-until.workspace         = true
tempfile.workspace           = true
unicase.workspace            = true
url.workspace                = true
util_macros                  = { workspace = true, optional = true }

[dev-dependencies]
path                  = { workspace = true, features = ["test-support"] }
rand.workspace        = true
util_macros.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-fs.workspace = true
dirs.workspace     = true
smol.workspace     = true
walkdir.workspace  = true
which.workspace    = true

[target.'cfg(target_os = "macos")'.dependencies]
mach2.workspace = true

[target."cfg(unix)".dependencies]
command-fds    = "0.3.1"
libc.workspace = true
nix            = { workspace = true, features = ["user"] }

[target."cfg(windows)".dependencies]
tendril           = "0.5"
windows.workspace = true

[features]
test-support = ["path/test-support", "rand", "util_macros"]

[lints]
workspace = true
