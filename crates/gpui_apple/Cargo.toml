[package]
name              = "gpui_apple"
version           = "0.1.0"
edition.workspace = true
license           = "Apache-2.0"
publish.workspace = true

[lib]
doctest = false
path    = "src/gpui_apple.rs"

[dependencies]
gpui.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
anyhow.workspace              = true
async-task.workspace          = true
block2.workspace              = true
collections.workspace         = true
core-foundation.workspace     = true
core-foundation-sys.workspace = true
core-graphics.workspace       = true
core-text                     = { workspace = true, optional = true }
derive_more.workspace         = true
dispatch2.workspace           = true
etagere.workspace             = true
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit                      = { workspace = true, features = ["source"], optional = true }
foreign-types.workspace       = true
futures.workspace             = true
gpui_util.workspace           = true
image.workspace               = true
libc.workspace                = true
log.workspace                 = true
mach2.workspace               = true
metal.workspace               = true
objc2.workspace               = true
objc2-core-foundation         = { workspace = true, features = ["CFBase", "CFData", "CFDictionary", "CFNumber", "CFString", "std"] }
objc2-core-text               = { workspace = true, optional = true }
objc2-core-video              = { workspace = true, features = [
  "CVMetalTexture",
  "CVMetalTextureCache",
  "CVPixelBuffer",
  "CVReturn",
  "objc2",
  "objc2-metal"
] }
objc2-foundation              = { workspace = true, features = ["NSNotification", "NSOperation", "NSProcessInfo", "NSThread", "block2"] }
objc2-metal                   = { version = "0.3", default-features = false, features = ["MTLDevice", "MTLPixelFormat", "MTLTexture"] }
objc2-quartz-core.workspace   = true
objc2-security.workspace      = true
parking_lot.workspace         = true
pathfinder_geometry           = { workspace = true, optional = true }
smallvec.workspace            = true
thiserror.workspace           = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.build-dependencies]
cbindgen.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
gpui             = { workspace = true, features = ["test-support"] }
objc2-core-video = { workspace = true, features = ["CVBase"] }

[features]
default         = []
bench-support   = ["gpui/bench-support"]
font-kit        = ["dep:core-text", "dep:font-kit", "dep:objc2-core-text", "dep:pathfinder_geometry"]
runtime_shaders = []
test-support    = ["gpui/test-support"]

[lints]
workspace = true
