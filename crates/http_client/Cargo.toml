[package]
name              = "http_client"
version           = "0.1.0"
edition.workspace = true
description       = "A HTTP client library for Zed and GPUI"
license           = "Apache-2.0"
publish           = false

[lib]
doctest = false
path    = "src/http_client.rs"

[dependencies]
anyhow.workspace           = true
bytes.workspace            = true
futures.workspace          = true
http.workspace             = true
http-body.workspace        = true
log                        = { workspace = true, optional = true }
parking_lot.workspace      = true
serde.workspace            = true
serde_json.workspace       = true
serde_urlencoded.workspace = true
url.workspace              = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-compression = { workspace = true, optional = true }
async-fs          = { workspace = true, optional = true }
async-tar         = { workspace = true, optional = true }
log.workspace     = true
sha2              = { workspace = true, optional = true }
tempfile          = { workspace = true, optional = true }
util              = { workspace = true, optional = true }

[features]
github-download = [
  "dep:async-compression",
  "dep:async-fs",
  "dep:async-tar",
  "dep:sha2",
  "dep:tempfile",
  "dep:util",
]
test-support    = ["dep:log"]

[lints]
workspace = true
