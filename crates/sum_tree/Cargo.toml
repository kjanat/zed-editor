[package]
name              = "sum_tree"
version           = "0.1.0"
edition.workspace = true
description       = "A sum tree data structure, a concurrency-friendly B-tree"
license           = "Apache-2.0"
publish           = false

[package.metadata.cargo-machete]
ignored = ["tracing"]

[lib]
doctest = false
path    = "src/sum_tree.rs"

[dependencies]
arrayvec           = "0.7.1"
log.workspace      = true
rayon.workspace    = true
tracing.workspace  = true
ztracing.workspace = true

[dev-dependencies]
ctor.workspace = true
rand.workspace = true
zlog.workspace = true

[lints]
workspace = true
