[package]
name              = "edit_prediction_cli"
version           = "0.1.0"
edition.workspace = true
license           = "GPL-3.0-or-later"
publish.workspace = true

[package.metadata.cargo-shear]
ignored = ["wasmtime", "workspace"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "ep"
path = "src/main.rs"

[dependencies]
anthropic.workspace               = true
anyhow.workspace                  = true
chrono.workspace                  = true
clap                              = "4"
client.workspace                  = true
cloud_llm_client                  = { workspace = true, features = ["predict-edits"] }
collections.workspace             = true
db.workspace                      = true
debug_adapter_extension.workspace = true
dirs.workspace                    = true
extension.workspace               = true
fs.workspace                      = true
futures.workspace                 = true
gpui.workspace                    = true
gpui_platform.workspace           = true
gpui_tokio.workspace              = true
http_client.workspace             = true
indoc.workspace                   = true
language.workspace                = true
language_extension.workspace      = true
language_model.workspace          = true
language_models.workspace         = true
languages                         = { workspace = true, features = ["load-grammars"] }
libc.workspace                    = true
log.workspace                     = true
node_runtime.workspace            = true
open_ai.workspace                 = true

edit_prediction                   = { workspace = true, features = ["cli-support"] }
edit_prediction_context.workspace = true
edit_prediction_metrics           = { workspace = true, features = ["tree-sitter"] }
flate2                            = "1.1.8"
gaoya                             = "0.2.0"
paths.workspace                   = true
project.workspace                 = true
prompt_store.workspace            = true
rand.workspace                    = true
release_channel.workspace         = true
reqwest_client.workspace          = true
rust-embed.workspace              = true
serde.workspace                   = true
serde_json.workspace              = true
settings.workspace                = true
shellexpand.workspace             = true
similar                           = "2.7.0"
smol.workspace                    = true
sqlez.workspace                   = true
sqlez_macros.workspace            = true
strum.workspace                   = true
telemetry_events.workspace        = true
terminal_view.workspace           = true
toml.workspace                    = true
util.workspace                    = true
wasmtime.workspace                = true
watch.workspace                   = true
zeta_prompt.workspace             = true

[dev-dependencies]
gpui                        = { workspace = true, features = ["test-support"] }
indoc.workspace             = true
pretty_assertions.workspace = true
project                     = { workspace = true, features = ["test-support"] }
tempfile.workspace          = true
workspace                   = { workspace = true, features = ["test-support"] }

[build-dependencies]
toml.workspace = true

# Wasmtime is included as a dependency in order to enable the same
# features that are enabled in Zed.
#
# If we don't enable these features we get crashes when creating
# a Tree-sitter WasmStore.
[features]
dynamic_prompts = []

[lints]
workspace = true
