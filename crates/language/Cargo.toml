[package]
name              = "language"
version           = "0.1.0"
edition.workspace = true
license           = "GPL-3.0-or-later"
publish.workspace = true

[package.metadata.cargo-shear]
ignored = ["tracing"]

[lib]
doctest = false
path    = "src/language.rs"

[[bench]]
harness = false
name    = "highlight_map"

[dependencies]
anyhow.workspace             = true
async-trait.workspace        = true
chardetng.workspace          = true
clock.workspace              = true
collections.workspace        = true
diffy                        = "0.4.2"
ec4rs.workspace              = true
encoding_rs.workspace        = true
fs.workspace                 = true
futures.workspace            = true
futures-lite.workspace       = true
fuzzy_nucleo.workspace       = true
globset.workspace            = true
gpui.workspace               = true
grammars                     = { workspace = true, optional = true }
http_client.workspace        = true
imara-diff.workspace         = true
itertools.workspace          = true
language_core.workspace      = true
log.workspace                = true
lsp.workspace                = true
parking_lot.workspace        = true
postage.workspace            = true
rand                         = { workspace = true, optional = true }
regex.workspace              = true
rpc.workspace                = true
semver.workspace             = true
serde.workspace              = true
serde_json.workspace         = true
settings.workspace           = true
shellexpand.workspace        = true
smallvec.workspace           = true
streaming-iterator.workspace = true
strsim.workspace             = true
sum_tree.workspace           = true
task.workspace               = true
text.workspace               = true
theme.workspace              = true
toml.workspace               = true
tracing.workspace            = true
tree-sitter                  = { workspace = true, features = ["wasm"] }
tree-sitter-json             = { workspace = true, optional = true }
tree-sitter-md               = { workspace = true, optional = true }
tree-sitter-python           = { workspace = true, optional = true }
tree-sitter-rust             = { workspace = true, optional = true }
tree-sitter-typescript       = { workspace = true, optional = true }
unicase                      = "2.6"
util.workspace               = true
watch.workspace              = true
zlog.workspace               = true
ztracing.workspace           = true

[dev-dependencies]
collections                             = { workspace = true, features = ["test-support"] }
criterion.workspace                     = true
ctor.workspace                          = true
gpui                                    = { workspace = true, features = ["test-support"] }
grammars.workspace                      = true
http_client                             = { workspace = true, features = ["test-support"] }
indoc.workspace                         = true
lsp                                     = { workspace = true, features = ["test-support"] }
pretty_assertions.workspace             = true
rand.workspace                          = true
settings                                = { workspace = true, features = ["test-support"] }
text                                    = { workspace = true, features = ["test-support"] }
theme_settings.workspace                = true
toml.workspace                          = true
tree-sitter-c.workspace                 = true
tree-sitter-elixir.workspace            = true
tree-sitter-embedded-template.workspace = true
tree-sitter-heex.workspace              = true
tree-sitter-html.workspace              = true
tree-sitter-json.workspace              = true
tree-sitter-md.workspace                = true
tree-sitter-python.workspace            = true
tree-sitter-ruby.workspace              = true
tree-sitter-rust.workspace              = true
tree-sitter-typescript.workspace        = true
unindent.workspace                      = true
util                                    = { workspace = true, features = ["test-support"] }
zlog.workspace                          = true

[features]
test-support = [
  "collections/test-support",
  "grammars",
  "lsp/test-support",
  "rand",
  "settings/test-support",
  "text/test-support",
  "tree-sitter-json",
  "tree-sitter-md",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-typescript",
  "util/test-support",
]

[lints]
workspace = true
