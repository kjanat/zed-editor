[package]
name              = "project"
version           = "0.1.0"
edition.workspace = true
license           = "GPL-3.0-or-later"
publish.workspace = true

[package.metadata.cargo-machete]
ignored = ["tracing"]

[lib]
doctest = false
path    = "src/project.rs"
test    = false

[[test]]
name              = "integration"
path              = "tests/integration/project_tests.rs"
required-features = ["test-support"]

[dependencies]
aho-corasick.workspace          = true
anyhow.workspace                = true
askpass.workspace               = true
async-trait.workspace           = true
base64.workspace                = true
buffer_diff.workspace           = true
circular-buffer.workspace       = true
client.workspace                = true
clock.workspace                 = true
collections.workspace           = true
context_server.workspace        = true
dap.workspace                   = true
extension.workspace             = true
fancy-regex.workspace           = true
fs.workspace                    = true
futures.workspace               = true
fuzzy.workspace                 = true
git.workspace                   = true
git_hosting_providers.workspace = true
globset.workspace               = true
gpui.workspace                  = true
http_client.workspace           = true
image.workspace                 = true
indexmap.workspace              = true
itertools.workspace             = true
language.workspace              = true
log.workspace                   = true
lsp.workspace                   = true
markdown.workspace              = true
node_runtime.workspace          = true
parking_lot.workspace           = true
paths.workspace                 = true
postage.workspace               = true
prettier.workspace              = true
rand.workspace                  = true
regex.workspace                 = true
release_channel.workspace       = true
remote.workspace                = true
rpc.workspace                   = true
schemars.workspace              = true
semver.workspace                = true
serde.workspace                 = true
serde_json.workspace            = true
settings.workspace              = true
sha2.workspace                  = true
shellexpand.workspace           = true
smallvec.workspace              = true
smol.workspace                  = true
snippet.workspace               = true
snippet_provider.workspace      = true
sum_tree.workspace              = true
task.workspace                  = true
tempfile.workspace              = true
terminal.workspace              = true
text.workspace                  = true
toml.workspace                  = true
tracing.workspace               = true
url.workspace                   = true
util.workspace                  = true
watch.workspace                 = true
wax.workspace                   = true
which.workspace                 = true
worktree.workspace              = true
zeroize.workspace               = true
zlog.workspace                  = true
ztracing.workspace              = true

[dev-dependencies]
buffer_diff                 = { workspace = true, features = ["test-support"] }
client                      = { workspace = true, features = ["test-support"] }
collections                 = { workspace = true, features = ["test-support"] }
context_server              = { workspace = true, features = ["test-support"] }
dap                         = { workspace = true, features = ["test-support"] }
dap_adapters                = { workspace = true, features = ["test-support"] }
db                          = { workspace = true, features = ["test-support"] }
encoding_rs.workspace       = true
fs                          = { workspace = true, features = ["test-support"] }
git2.workspace              = true
gpui                        = { workspace = true, features = ["test-support"] }
language                    = { workspace = true, features = ["test-support"] }
lsp                         = { workspace = true, features = ["test-support"] }
prettier                    = { workspace = true, features = ["test-support"] }
pretty_assertions.workspace = true
project                     = { workspace = true, features = ["test-support"] }
remote                      = { workspace = true, features = ["test-support"] }
rpc                         = { workspace = true, features = ["test-support"] }
settings                    = { workspace = true, features = ["test-support"] }
snippet_provider            = { workspace = true, features = ["test-support"] }
unindent.workspace          = true
util                        = { workspace = true, features = ["test-support"] }
worktree                    = { workspace = true, features = ["test-support"] }

[features]
test-support = [
  "buffer_diff/test-support",
  "client/test-support",
  "dap_adapters/test-support",
  "dap/test-support",
  "gpui/test-support",
  "language/test-support",
  "prettier/test-support",
  "remote/test-support",
  "settings/test-support",
  "snippet_provider/test-support",
  "text/test-support",
  "worktree/test-support",
]

[lints]
workspace = true
