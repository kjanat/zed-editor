#:schema ../../../../crates/extension_api/schemas/language-config.schema.json

name                        = "HTML"
grammar                     = "html"
path_suffixes               = ["html", "htm", "shtml"]
autoclose_before            = ">})"
block_comment               = { start = "<!--", prefix = "  ", end = "-->", tab_size = 1 }                     # was tab_size = 0
wrap_characters             = { start_prefix = "<", start_suffix = ">", end_prefix = "</", end_suffix = ">" }
brackets                    = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
  { start = "<!--", end = "-->", surround = true, newline = false, close = false },                            # CHANGED
  { start = "<", end = ">", close = false, newline = true },                                                   # CHANGED
  { start = "!--", end = " --", close = true, newline = false, not_in = ["comment", "string"] },
]
completion_query_characters = ["-"]
prettier_parser_name        = "html"
first_line_pattern          = "(?i)^<!DOCTYPE html>"

[overrides.default]
linked_edit_characters = ["-"]
