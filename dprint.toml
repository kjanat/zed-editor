#:schema https://dprint.kjanat.dev/schemas/v0.json

extends     = "https://raw.githubusercontent.com/kjanat/kjanat/master/configs/dprint.remote.json"
useTabs     = true
incremental = true
excludes    = [
  "!.agents",
  "!.agents/**",
  "**/*.hbs",
  "**/*.lock",
  "**/fixtures",
  "**/node_modules",
  "**/target",
  "**/test_data",
  "**/golden",
  "crates/gpui_web/examples/hello_web/.cargo/config.toml",
  "script/lib/deploy-helpers.sh"
]
plugins     = ["npm:@dprint/exec@0.7.3/plugin.json@704701df449dd7e942a71144773778ac529d68c2e4657bfc236d393b898b9a67"]

[jsonSchemaSort]
associations = ["**/schema.json", "**/*.schema.json"]

[json]
trailingCommas = "maintain"

[typescript]
lineWidth = 150

[markdown]
lineWidth                       = 80
emphasisKind                    = "asterisks"
"codeBlock.preserveIndentation" = true
"codeBlock.useTabs"             = false
"html.indentWidth"              = 2
"html.preferSingleLine"         = true
"html.skipFormat"               = true
"html.useTabs"                  = false

[markup]
associations = ["!**/*.svg"]

[ruff]
preview = true

[yaml]
printWidth = 160

[exec]
cwd      = "${configDir}"
cacheKey = "1"
timeout  = 30

[[exec.commands]]
command       = "tombi format - --stdin-filename {{file_path}}"
exts          = ["toml"]
cacheKeyFiles = ["tombi.toml"]

[[exec.commands]]
command       = "rustfmt"
exts          = ["rs"]
cacheKeyFiles = ["rustfmt.toml", ".cargo/config.toml", "rust-toolchain.toml"]
