---
name: fork_upstream_sync
on:
  schedule: [{ cron: "37 7 * * *", timezone: &Adam Europe/Amsterdam }, { cron: "37 11 * * *", timezone: *Adam }]
  workflow_dispatch: null
concurrency: { group: "${{ github.workflow }}", cancel-in-progress: false, queue: single }
permissions: { contents: read }
jobs:
  prepare:
    if: github.repository == 'kjanat/zed-editor' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    cancel-timeout-minutes: 1
    permissions: { contents: read, issues: read, pull-requests: read }
    outputs: { result: "${{ steps.result.outputs.result }}", claude: "${{ steps.claude.outputs.run }}" }
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            env: &git-advice { GIT_CONFIG_COUNT: "1", GIT_CONFIG_KEY_0: advice.defaultBranchName, GIT_CONFIG_VALUE_0: "false" }
            with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false }
          - name: export and create dirs env
            env: { o: "${{ runner.temp }}/sync-output", e: "${{ runner.temp }}/sync-export" }
            run: printf "sync_output=%s\nsync_export=%s\n" "${o}" "${e}" >> "${GITHUB_ENV}"; mkdir -p "${o}"
          - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: script/upstream-sync/Dockerfile
          load: true
          tags: upstream-sync-tools
          cache-from: type=gha,scope=upstream-sync-tools
          cache-to: type=gha,mode=max,scope=upstream-sync-tools
      - name: Prepare the candidate
        shell: bash
        run: |
          mkdir -p "${sync_output}"
          # Untrusted formatter output must not be interpreted as runner commands.
          marker="$(cat /proc/sys/kernel/random/uuid)"; echo "::stop-commands::${marker}"; trap 'echo "::${marker}::"' EXIT
          user_id="$(id -u)"; group_id="$(id -g)"
          docker run --rm --user "${user_id}:${group_id}" --cap-drop=ALL --security-opt=no-new-privileges \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/source,readonly" \
            --mount "type=bind,src=${sync_output},dst=/output" \
            upstream-sync-tools bash /source/script/upstream-sync/prepare.sh
      - uses: kjanat/actions-shells@v0
      - &export
        name: Export bounded output
        shell: "actions-shell perl {0}"
        run: |
          use Fcntl qw(:DEFAULT :mode);
          use Errno qw(ENOENT);
          use File::Copy qw(copy);

          my($s,$d)=@ARGV;
          $s//=$ENV{sync_output}; $d//=$ENV{sync_export};
          die "missing source/destination\n" unless $s && $d;
          mkdir $d or die "$d: $!";

          for(["result",32],["sync.bundle",2<<30],["conflict-report.md",60000],["issue-body.md",60000],
              ["resolution.md",16000],["human.txt",16000],
              ["formatting-only.txt",16000],["formatted-three-way.txt",16000],["lockfiles.txt",16000],
              ["structured.txt",16000],["fork-deleted.txt",16000],["dropped-github.txt",16000]){
            my($n,$m)=@$_; my $i;
            unless(sysopen $i,"$s/$n",O_RDONLY|O_NOFOLLOW|O_NONBLOCK){
              next if $!==ENOENT && $n ne "result";
              die "$n: $!";
            }

            my @x=stat $i;
            die "Invalid container output: $n\n" unless @x && S_ISREG($x[2]) && $x[7]<=$m;

            sysopen(my $o,"$d/$n",O_WRONLY|O_CREAT|O_EXCL) or die "$n: $!";
            copy($i,$o) or die "$n: $!";
          }
      - name: Read the result
        id: result
        run: |
          result="$(<"${sync_export}/result")"
          [[ "${result}" =~ ^(unchanged|clean|resolved|partial)$ ]] || { echo "Invalid result: ${result}" >&2; exit 1; }
          echo "result=${result}" >>"${GITHUB_OUTPUT}"
      - name: Skip Claude while a sync PR is open or Claude already tried this master
        id: claude
        if: steps.result.outputs.result == 'partial'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          prs="$(gh pr list -R "${GITHUB_REPOSITORY}" --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("sync/upstream"))] | length')"
          tried="$(gh issue list -R "${GITHUB_REPOSITORY}" --state open --label upstream-sync-conflict --json body,comments \
            --jq "[.[] | .body, .comments[].body | select(contains(\"claude-attempt fork=${GITHUB_SHA}\"))] | length")"
          [[ "${prs}" == 0 && "${tried}" == 0 ]] && run=true || run=false
          echo "run=${run}" | tee -a "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-sync-candidate
          path: ${{ env.sync_export }}
          if-no-files-found: error
          retention-days: 30
  resolve:
    needs: prepare
    if: needs.prepare.outputs.result == 'partial' && needs.prepare.outputs.claude == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    cancel-timeout-minutes: 1
    permissions: { contents: read }
    steps:
      - parallel:
          - &checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            env: *git-advice
            with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false }
          - &candidate
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            with: { name: upstream-sync-candidate, path: "${{ runner.temp }}/sync-candidate" }
      - &sync-scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env: *git-advice
        with:
          ref: ${{ github.sha }}
          path: .sync-scripts
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /script/upstream-sync/
            /script/clippy
      - &mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with: { bootstrap: true, bootstrap_skip: compose }
      - &rust-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { shared-key: upstream-sync, cache-on-failure: true }
      - name: Run the export once before Claude starts
        run: &export-resolution bash .sync-scripts/script/upstream-sync/resolve.sh export
          "${RUNNER_TEMP}"/sync-{candidate,resolution}
      - name: Clear the trial export
        run: rm -r "${RUNNER_TEMP}/sync-resolution" .sync
      - name: Resolve the conflicts with Claude
        continue-on-error: true
        timeout-minutes: 280
        uses: anthropics/claude-code-action/base-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        env: { DISABLE_AUTOUPDATER: "1" }
        with:
          prompt_file: ${{ github.workspace }}/script/upstream-sync/resolve-prompt.md
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: --model claude-opus-5-5 --permission-mode auto --add-dir ${{ runner.temp }}/sync-candidate
      - name: Save Claude's checkout, notes, logs and session
        if: always()
        env: { GIT_INDEX_FILE: "${{ runner.temp }}/claude.index", TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }
        run: |
          r="${RUNNER_TEMP}/sync-resolution"
          mkdir -p "${r}"
          git read-tree HEAD
          git add -A
          git diff --cached --binary HEAD >"${r}/checkout.patch"
          if [[ -d .sync ]]; then cp -r .sync "${r}/state"; fi
          if [[ -f "${RUNNER_TEMP}/claude-execution-output.json" ]]; then cp "${RUNNER_TEMP}/claude-execution-output.json" "${r}/"; fi
          if [[ -d ~/.claude/projects ]]; then cp -r ~/.claude/projects "${r}/claude-projects"; fi
          if [[ -n "${TOKEN}" ]]; then find "${r}" -type f -exec perl -pi -e 's/\Q$ENV{TOKEN}\E/***/g' {} +; fi
      - name: Export the resolution
        if: always()
        run: *export-resolution
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: upstream-sync-resolution
          path: ${{ runner.temp }}/sync-resolution
          if-no-files-found: warn
          retention-days: 30
  verify:
    needs: [prepare, resolve]
    if: always() && needs.prepare.outputs.result == 'partial' && needs.prepare.outputs.claude == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    cancel-timeout-minutes: 1
    permissions: { contents: read }
    steps:
      - parallel:
          - *checkout
          - *candidate
          - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
            continue-on-error: true
            with: { name: upstream-sync-resolution, path: "${{ runner.temp }}/sync-resolution" }
          - name: Create the output directories
            env: { o: "${{ runner.temp }}/sync-output", e: "${{ runner.temp }}/sync-export", r: "${{ runner.temp }}/sync-resolution" }
            run: printf "sync_output=%s\nsync_export=%s\nsync_resolution=%s\n" "${o}" "${e}" "${r}" >>"${GITHUB_ENV}";
              mkdir -p "${o}" "${r}"
      - *sync-scripts
      - *mise
      - *rust-cache
      - name: Verify the resolution on a clean runner
        run: bash .sync-scripts/script/upstream-sync/resolve.sh verify
          "${RUNNER_TEMP}"/sync-{candidate,resolution} "${sync_output}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: upstream-sync-verify-logs
          path: .sync
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - uses: kjanat/actions-shells@v0
      - *export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-sync-verified
          path: ${{ env.sync_export }}
          if-no-files-found: error
          retention-days: 30
  open-sync-pr:
    needs: [prepare, verify]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    cancel-timeout-minutes: 1
    permissions: { contents: write, pull-requests: write, issues: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env: *git-advice
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.result == 'success' && 'upstream-sync-verified' || 'upstream-sync-candidate' }}
          path: ${{ runner.temp }}/sync-candidate
      - name: Open the sync PR without executing the candidate
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          SYNC_AUTO_MERGE: ${{ secrets.SYNC_TOKEN != '' }}
          SYNC_VERIFY: ${{ needs.verify.result }}
        run: python3 script/upstream-sync/open-sync-pr.py "${RUNNER_TEMP}/sync-candidate"
