# Upstream code runs only inside an isolated container or the resolver's
# sandbox. The publisher never checks out the candidate tree and rejects
# changes to GitHub automation.
---
name: fork_upstream_sync
on:
  schedule: [{ cron: "37 7 * * *", timezone: &Adam Europe/Amsterdam }, { cron: "37 11 * * *", timezone: *Adam }]
  workflow_dispatch:
    inputs:
      publish: { description: Publish the result, type: boolean, default: true }
concurrency: { group: "${{ github.workflow }}", cancel-in-progress: false }
permissions: { contents: read }
jobs:
  prepare:
    if: github.repository == 'kjanat/zed-editor' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    cancel-timeout-minutes: 1
    outputs: { result: "${{ steps.result.outputs.result }}" }
    steps:
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            env: &git-advice { GIT_CONFIG_COUNT: "1", GIT_CONFIG_KEY_0: advice.defaultBranchName, GIT_CONFIG_VALUE_0: "false" }
            with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false }
          - name: export and create dirs env
            env: { o: "${{ runner.temp }}/sync-output", e: "${{ runner.temp }}/sync-export" }
            run: printf "sync_output=%s\nsync_export=%s\n" "${o}" "${e}" >> "${GITHUB_ENV}"; mkdir -p "${o}"
          - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: script/upstream-sync/Dockerfile
          load: true
          tags: upstream-sync-tools
          cache-from: type=gha,scope=upstream-sync-tools
          cache-to: type=gha,mode=max,scope=upstream-sync-tools
      - name: Prepare the candidate
        shell: bash
        run: |
          mkdir -p "${sync_output}"
          # Untrusted formatter output must not be interpreted as runner commands.
          marker="$(cat /proc/sys/kernel/random/uuid)"; echo "::stop-commands::${marker}"; trap 'echo "::${marker}::"' EXIT
          user_id="$(id -u)"; group_id="$(id -g)"
          docker run --rm --user "${user_id}:${group_id}" --cap-drop=ALL --security-opt=no-new-privileges \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/source,readonly" \
            --mount "type=bind,src=${sync_output},dst=/output" \
            upstream-sync-tools bash /source/script/upstream-sync/prepare.sh
      - uses: kjanat/actions-shells@v0
      - &export
        name: Export bounded output
        shell: "actions-shell perl {0}"
        run: |
          use Fcntl qw(:DEFAULT :mode);
          use Errno qw(ENOENT);
          use File::Copy qw(copy);

          my($s,$d)=@ARGV;
          $s//=$ENV{sync_output}; $d//=$ENV{sync_export};
          die "missing source/destination\n" unless $s && $d;
          mkdir $d or die "$d: $!";

          for(["result",32],["sync.bundle",256<<20],["conflict-report.md",60000],["issue-body.md",60000],
              ["resolution.md",16000],["human.txt",16000],
              ["formatting-only.txt",16000],["formatted-three-way.txt",16000],["lockfiles.txt",16000],
              ["structured.txt",16000],["fork-deleted.txt",16000],["dropped-github.txt",16000]){
            my($n,$m)=@$_; my $i;
            unless(sysopen $i,"$s/$n",O_RDONLY|O_NOFOLLOW|O_NONBLOCK){
              next if $!==ENOENT && $n ne "result";
              die "$n: $!";
            }

            my @x=stat $i;
            die "Invalid container output: $n\n" unless @x && S_ISREG($x[2]) && $x[7]<=$m;

            sysopen(my $o,"$d/$n",O_WRONLY|O_CREAT|O_EXCL) or die "$n: $!";
            copy($i,$o) or die "$n: $!";
          }
      - name: Read the result
        id: result
        run: |
          result="$(<"${sync_export}/result")"
          [[ "${result}" =~ ^(unchanged|clean|resolved|partial)$ ]] || { echo "Invalid result: ${result}" >&2; exit 1; }
          echo "result=${result}" >>"${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-sync-candidate
          path: ${{ env.sync_export }}
          if-no-files-found: error
          retention-days: 1
  resolve:
    needs: prepare
    if: needs.prepare.outputs.result == 'partial'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    cancel-timeout-minutes: 1
    permissions: { contents: read }
    env: { SYNC_WORK: /mnt/sync }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env: *git-advice
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Create the work directories
        env: { o: "${{ runner.temp }}/sync-output", e: "${{ runner.temp }}/sync-export" }
        run: |
          printf "sync_output=%s\nsync_export=%s\n" "${o}" "${e}" >>"${GITHUB_ENV}"
          mkdir -p "${o}"
          sudo install -d -o "$(id -u)" -g "$(id -g)" "${SYNC_WORK}"
          # Ubuntu 24.04 strips capabilities from unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: upstream-sync-candidate, path: "${{ runner.temp }}/sync-candidate" }
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with: { bootstrap: true, bootstrap_skip: compose }
      - name: Rebuild the merge in the sandbox work directory
        id: setup
        continue-on-error: true
        run: script/upstream-sync/resolve.sh setup "${RUNNER_TEMP}/sync-candidate" "${SYNC_WORK}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.setup.outcome == 'success'
        env: { CARGO_HOME: /mnt/sync/cargo }
        with: { shared-key: upstream-sync-resolver, workspaces: /mnt/sync/candidate -> target, cache-on-failure: true }
      - name: Resolve the conflicts with Claude
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action/base-action@97c53473391bff1901034d4b454b5bac7ab7a029 # v1.0.239
        env: { DISABLE_AUTOUPDATER: "1" }
        with:
          prompt_file: /mnt/sync/prompt.md
          settings: /mnt/sync/sandbox/claude-settings.json
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-opus-5-5 --permission-mode auto --setting-sources user
            --add-dir /mnt/sync/candidate --add-dir /mnt/sync/out
      - name: Validate the resolution independently
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: script/upstream-sync/resolve.sh validate "${SYNC_WORK}"
      - name: Package the resolved merge or the failure report
        run: script/upstream-sync/resolve.sh package "${SYNC_WORK}" "${sync_output}" "${RUNNER_TEMP}/sync-candidate"
      - uses: kjanat/actions-shells@v0
      - *export
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-sync-resolved
          path: ${{ env.sync_export }}
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [prepare, resolve]
    if: >-
      always() && needs.prepare.result == 'success'
      && (needs.resolve.result == 'success' || needs.resolve.result == 'skipped')
      && github.event.inputs.publish != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    cancel-timeout-minutes: 1
    permissions: { contents: write, pull-requests: write, issues: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env: *git-advice
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "${{ needs.resolve.result == 'success' && 'upstream-sync-resolved' || 'upstream-sync-candidate' }}"
          path: "${{ runner.temp }}/sync-candidate"
      - name: Validate and publish without executing the candidate
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          SYNC_AUTO_MERGE: ${{ secrets.SYNC_TOKEN != '' }}
        run: python3 script/upstream-sync/publish.py "${RUNNER_TEMP}/sync-candidate"
