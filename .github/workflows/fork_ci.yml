# CI gate for kjanat/zed-editor.
#
# Distilled from upstream's run_tests.yml, which runs on Zed's namespace-*
# and self-hosted runners that do not exist on this fork. This variant fits
# GitHub-hosted runners by building the workspace's test archive once and
# running it across eight shards.
#
# Guards every push and PR on master, including the PRs the upstream-sync
# workflow opens.
---
name: fork_ci
on:
  push: { branches: [master] }
  pull_request: { branches: [master] }
  workflow_dispatch: null
permissions: { contents: read }
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  style:
    if: github.repository == 'kjanat/zed-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: kjanat/dprint-check@v3

  clippy:
    if: github.repository == 'kjanat/zed-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - parallel:
          - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
            with: { shared-key: fork-ci-clippy, cache-on-failure: true }
          - name: Install build dependencies
            run: ./script/linux
      - name: clippy
        run: ./script/clippy
      - name: Show disk usage
        if: always()
        run: df -h /

  build_tests:
    if: github.repository == 'kjanat/zed-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # rust-cache strips workspace-member artifacts from what it saves, so
    # sccache carries the per-crate compiles between runs.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { shared-key: fork-ci-tests, cache-on-failure: true }
      - parallel:
          - name: Install build dependencies
            run: ./script/linux
          # Upstream's tests assume nextest's process-per-test isolation; under
          # plain cargo test they share process globals and flake.
          - name: Install nextest
            uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
            with: { tool: nextest }
          - name: Install sccache
            uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Build the test archive
        run: >
          cargo nextest archive
          --workspace
          --archive-file nextest-archive.tar.zst
      - name: Upload the test archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: nextest-archive, path: nextest-archive.tar.zst, retention-days: 1 }
      - name: Show disk usage
        if: always()
        run: df -h /

  tests:
    if: github.repository == 'kjanat/zed-editor'
    needs: build_tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4, 5, 6, 7, 8] }
    # The collab suite needs a live Postgres.
    services:
      postgres:
        image: postgres:15@sha256:1b92e7a80c021647bf70f5d3eb66066a998e4f5cf43c07bb9dc9f729782cf88e
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 500ms --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - parallel:
          # The gpui_wgpu tests request a Vulkan adapter and the runner has no GPU.
          - name: Install build dependencies and a software Vulkan driver
            run: |
              ./script/linux
              sudo apt-get install -y mesa-vulkan-drivers
          - name: Install nextest
            uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
            with: { tool: nextest }
          # The extension_host suite shells out to cargo, and no shard step
          # compiles anything, so the pinned toolchain must be provisioned here.
          - name: Install the pinned Rust toolchain
            run: |
              rustup toolchain install
              rustup target add wasm32-wasip2
          - name: Download the test archive
            uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
            with: { name: nextest-archive }
      - name: Run the workspace tests (shard ${{ matrix.shard }} of 8)
        run: >
          cargo nextest run
          --archive-file nextest-archive.tar.zst
          --workspace-remap .
          --no-fail-fast
          --partition 'count:${{ matrix.shard }}/8'
      - name: Show disk usage
        if: always()
        run: df -h /
