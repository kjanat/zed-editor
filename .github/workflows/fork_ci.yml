# CI gate for kjanat/zed-editor.
#
# Distilled from upstream's run_tests.yml, which runs on Zed's namespace-*
# and self-hosted runners that do not exist on this fork. This variant fits
# GitHub-hosted runners by testing only the crates this fork actually
# changes; the full workspace is covered by the release pipeline's builds.
#
# Guards every push and PR on master, including the PRs the upstream-sync
# workflow opens.
---
name: fork_ci
on:
  push: { branches: [master] }
  pull_request: { branches: [master] }
  workflow_dispatch: null
permissions: { contents: read }
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always

jobs:
  style:
    if: github.repository == 'kjanat/zed-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: kjanat/dprint-check@v3

  clippy:
    if: github.repository == 'kjanat/zed-editor'
    strategy:
      fail-fast: false
      matrix:
        include: [
          { os: macos-latest, command: ./script/clippy, shell: bash },
          { os: ubuntu-latest, command: ./script/clippy, shell: bash },
          { os: windows-latest, command: ./script/clippy.ps1, shell: pwsh },
        ]
    defaults: { run: { shell: "${{ matrix.shell }}" } }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - parallel:
          - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
            with: { shared-key: fork-ci-clippy, cache-on-failure: true }
          - name: Install build dependencies
            if: runner.os == 'Linux'
            run: ./script/linux
      - name: clippy
        run: ${{ matrix.command }}
      - name: Show disk usage
        if: always() && runner.os != 'Windows'
        run: df -h /

  tests:
    if: github.repository == 'kjanat/zed-editor'
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "24", check-latest: true, package-manager-cache: false }
      - parallel:
          - name: Install build dependencies
            if: runner.os == 'Linux'
            run: ./script/linux
          - name: Install nextest
            uses: taiki-e/install-action@nextest
          - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
            with: { shared-key: fork-ci-tests, cache-on-failure: true }
      - name: Test the crates this fork changes
        run: cargo nextest run --no-fail-fast -p fs -p language -p worktree -p project -p lsp -p language_tools -p repl -p auto_update
      - name: Show disk usage
        if: always() && runner.os != 'Windows'
        run: df -h /
