# CI gate for kjanat/zed-editor.
#
# Distilled from upstream's run_tests.yml, which runs on Zed's namespace-*
# and self-hosted runners that do not exist on this fork. The plan job selects
# the workspace packages a change can affect: the packages whose files changed
# and every package that depends on them. Clippy and the affected test suite
# build only those packages.
#
# Guards every push and PR on master, including the PRs the upstream-sync
# workflow opens.
---
name: fork_ci
on:
  push: { branches: [master] }
  pull_request: { branches: [master] }
  workflow_dispatch: null
permissions: { contents: read }
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }

jobs:
  plan:
    if: github.repository == 'kjanat/zed-editor'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    cancel-timeout-minutes: 1
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      packages: ${{ steps.plan.outputs.packages }}
      package_args: ${{ steps.plan.outputs.package_args }}
      sync: ${{ steps.plan.outputs.sync }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 2 }
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with: { cache_save: "${{ github.ref == 'refs/heads/master' }}" }
      - name: Test the planner
        run: mise run test-fork-ci
      - name: Select the affected packages
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "${EVENT}" in
            pull_request) base="$(git rev-parse HEAD^1)" ;;
            push)
              base=""
              if [[ "${BEFORE}" == *[!0]* ]] && git fetch --no-tags --depth=1 origin "${BEFORE}"; then
                base="${BEFORE}"
              fi
              ;;
            *) base="" ;;
          esac
          mise run affected-packages --base "${base}" --head HEAD | tee -a "${GITHUB_OUTPUT}"
          sync_inputs=(
            .cargo/config.toml .dprint.jsonc .mise.toml rust-toolchain.toml rustfmt.toml tombi.toml
            .github/workflows/fork_ci.yaml .github/workflows/fork_upstream_sync.yaml script/upstream-sync
          )
          if [[ -n "${base}" ]] && git diff --quiet "${base}" HEAD -- "${sync_inputs[@]}"; then
            echo "sync=false"
          else
            echo "sync=true"
          fi | tee -a "${GITHUB_OUTPUT}"

  sync_security:
    if: github.repository == 'kjanat/zed-editor' && needs.plan.outputs.sync == 'true'
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    cancel-timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with: { cache_save: "${{ github.ref == 'refs/heads/master' }}" }
      - name: Test the upstream sync
        run: mise run test-upstream-sync
  style:
    if: github.repository == 'kjanat/zed-editor'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    cancel-timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: kjanat/dprint-check@v3

  clippy:
    if: github.repository == 'kjanat/zed-editor'
    needs: plan
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-26.04, windows-2025-vs2026, macos-latest] }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    cancel-timeout-minutes: 1
    env:
      SCOPE: ${{ needs.plan.outputs.scope }}
      PACKAGE_ARGS: ${{ needs.plan.outputs.package_args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SCOPE != 'none'
        with: { persist-credentials: false }
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        if: env.SCOPE != 'none'
        with: { bootstrap: true, bootstrap_skip: compose, cache_save: "${{ github.ref == 'refs/heads/master' }}" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.SCOPE != 'none'
        with: { shared-key: fork-ci-clippy, save-if: "${{ github.ref == 'refs/heads/master' }}", cache-on-failure: false }
      - name: Clippy
        if: env.SCOPE != 'none'
        shell: bash
        run: |
          read -ra package_args <<< "${PACKAGE_ARGS}"
          mise run clippy --no-deps "${package_args[@]}"
      - name: Show disk usage
        if: always() && env.SCOPE != 'none' && runner.os != 'Windows'
        shell: bash
        run: df -h /

  test_suites:
    if: github.repository == 'kjanat/zed-editor'
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026, macos-latest]
        suite: [remote-save, affected, editor-backup]
        include:
          - { suite: remote-save, package: collab }
          - { suite: editor-backup, package: editor }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    cancel-timeout-minutes: 1
    steps:
      - name: Decide whether the suite runs
        id: suite
        shell: bash
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
          PACKAGES: ${{ needs.plan.outputs.packages }}
          PACKAGE: ${{ matrix.package }}
        run: |
          case "${SCOPE}" in
            all) run=true ;;
            packages) [[ -z "${PACKAGE}" || " ${PACKAGES} " == *" ${PACKAGE} "* ]] && run=true || run=false ;;
            *) run=false ;;
          esac
          echo "run=${run}" | tee -a "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.suite.outputs.run == 'true'
        with: { persist-credentials: false }
      # Concurrent action startup can lock the runner's event.json on Windows.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        if: steps.suite.outputs.run == 'true'
        with:
          bootstrap: true
          bootstrap_skip: ${{ matrix.suite != 'affected' && 'compose' || '' }}
          cache_save: ${{ github.ref == 'refs/heads/master' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.suite.outputs.run == 'true'
        with: { shared-key: fork-ci-tests, save-if: "${{ github.ref == 'refs/heads/master' && matrix.suite == 'affected' }}", cache-on-failure: false }
      # The extension store test allows 60 seconds for installing the test extension.
      - name: Build the test extension
        if: >-
          steps.suite.outputs.run == 'true' && matrix.suite == 'affected'
          && (needs.plan.outputs.scope == 'all' || contains(format(' {0} ', needs.plan.outputs.packages), ' extension_host '))
        shell: bash
        run: mise run build-test-extension
      - name: Test remote save file identity conflicts
        if: steps.suite.outputs.run == 'true' && matrix.suite == 'remote-save'
        shell: bash
        run: cargo nextest run --no-fail-fast -p collab --features test-support --test remote_save_tests 2>&1 | tee tests.log
      - name: Test the affected packages
        if: steps.suite.outputs.run == 'true' && matrix.suite == 'affected'
        shell: bash
        env: { PACKAGE_ARGS: "${{ needs.plan.outputs.package_args }}" }
        run: |
          read -ra package_args <<< "${PACKAGE_ARGS:---workspace}"
          cargo nextest run --no-fail-fast --no-tests=warn "${package_args[@]}" 2>&1 | tee tests.log
      - name: Test editor save-backup and rendering regressions
        if: steps.suite.outputs.run == 'true' && matrix.suite == 'editor-backup'
        shell: bash
        run: cargo nextest run --no-fail-fast -p editor -E 'test(test_save_backup_conflict_) | test(element::tests::)' 2>&1 | tee tests.log
      - name: Check native linker diagnostics
        if: steps.suite.outputs.run == 'true' && (runner.os == 'Windows' || runner.os == 'macOS')
        shell: bash
        run: |
          # Keep macOS __eh_frame size/performance warnings visible without failing debug tests.
          if grep -E 'LNK4217' tests.log; then
            echo "::error::Native test build emitted linker warnings"
            exit 1
          else test "$?" -eq 1; fi
      - name: Show disk usage
        if: always() && steps.suite.outputs.run == 'true' && runner.os != 'Windows'
        run: df -h /

  # Preserve the check names required by branch protection after splitting the suites.
  tests:
    if: always() && github.repository == 'kjanat/zed-editor'
    needs: test_suites
    strategy:
      matrix: { os: [ubuntu-26.04, windows-2025-vs2026, macos-latest] }
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    cancel-timeout-minutes: 1
    steps:
      - name: Require all test suites to pass
        env: { TEST_RESULT: "${{ needs.test_suites.result }}" }
        run: test "${TEST_RESULT}" = success
