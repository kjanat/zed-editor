# yaml-language-server: $schema=github-workflow.json
---
name: CodeQL
on:
  push: { branches: [master] }
  schedule: [{ cron: "43 8 * * 4" }]
permissions: { contents: read }
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.repository == 'kjanat/zed-editor'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    cancel-timeout-minutes: 1
    permissions: { contents: read, security-events: write }
    strategy:
      fail-fast: false
      matrix: { language: [actions, javascript-typescript, python, rust] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with: { languages: "${{ matrix.language }}", build-mode: none }
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with: { category: "/language:${{ matrix.language }}" }
