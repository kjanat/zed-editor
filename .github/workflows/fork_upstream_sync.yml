# Upstream code runs only inside an isolated container. The publisher never
# checks out the candidate tree and rejects changes to GitHub automation.
---
name: fork_upstream_sync
on:
  schedule: [cron: "0 6,18 * * *"]
  workflow_dispatch: null
concurrency: { group: "${{ github.workflow }}", cancel-in-progress: false }
permissions: { contents: read }
jobs:
  prepare:
    if: github.repository == 'kjanat/zed-editor' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Build the isolated sync tools
        run: docker build -t upstream-sync-tools script/upstream-sync
      - name: Prepare the candidate without runner credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sync-output"
          # Untrusted formatter output must not be interpreted as runner commands.
          marker=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::${marker}"
          trap 'echo "::${marker}::"' EXIT
          user_id=$(id -u)
          group_id=$(id -g)
          docker run --rm --user "${user_id}:${group_id}" --cap-drop=ALL --security-opt=no-new-privileges \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/source,readonly" \
            --mount "type=bind,src=${RUNNER_TEMP}/sync-output,dst=/output" \
            upstream-sync-tools bash /source/script/upstream-sync/prepare.sh
      - name: Export only regular candidate files
        run: python3 script/upstream-sync/export.py "${RUNNER_TEMP}/sync-output" "${RUNNER_TEMP}/sync-export"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-sync-candidate
          path: ${{ runner.temp }}/sync-export/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write, pull-requests: write, issues: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: upstream-sync-candidate, path: "${{ runner.temp }}/sync-candidate" }
      - name: Validate and publish without executing the candidate
        env:
          # A fine-grained PAT limited to this repository can trigger PR CI.
          # This token is never passed to the preparation job or its container.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: python3 script/upstream-sync/publish.py "${RUNNER_TEMP}/sync-candidate"
