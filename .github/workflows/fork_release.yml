---
name: fork_release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0}{1}{2}{3}{4}{5}{6}{7}', inputs.tag || 'untagged', inputs.linux && ' linux' || '', inputs.mac && ' mac' || '', inputs.windows && ' windows' || '', inputs.freebsd && ' freebsd' || '', inputs.bwrap && ' bwrap' || '', inputs.pacman && ' pacman' || '', !inputs.upload && ' (dry run)' || '') || '' }}
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
    inputs:
      tag: { description: Tag to publish the release under, required: false, type: string }
      linux: { description: Build the Linux bundles, type: boolean, default: true }
      mac: { description: Build the macOS bundles, type: boolean, default: true }
      windows: { description: Build the Windows bundles, type: boolean, default: true }
      freebsd: { description: Build the FreeBSD remote server, type: boolean, default: true }
      bwrap: { description: Build static bubblewrap, type: boolean, default: true }
      pacman: { description: Build the pacman packages and repository, type: boolean, default: true }
      upload:
        description: Upload onto the tag's release; off tests only whether the builds work
        type: boolean
        default: true
permissions: { contents: read }
env: { CARGO_TERM_COLOR: always, CARGO_INCREMENTAL: 0, RUST_BACKTRACE: 1 }
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
defaults: { run: { shell: "bash -euxo pipefail {0}" } }
jobs:
  create_draft_release:
    if: github.repository == 'kjanat/zed-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }
    outputs: { tag: "${{ steps.resolve.outputs.tag }}" }
    env: { GH_REPO: "${{ github.repository }}" }
    steps:
      - name: Resolve the tag
        id: resolve
        env: { INPUT_TAG: "${{ inputs.tag }}" }
        run: |
          tag="${INPUT_TAG}"
          if [[ -z "${tag}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]];
            then tag="${GITHUB_REF_NAME}";
            else tag="dev-${GITHUB_SHA:0:7}"; fi
          fi
          echo "tag=${tag}" | tee "${GITHUB_ENV}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Create the draft release
        if: github.event_name == 'push' || inputs.upload
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "${tag}" >/dev/null 2>&1; then exit 0; fi
          prerelease=()
          case "${tag}" in
            v[0-9]*) ;;
            *) prerelease=(--prerelease) ;;
          esac
          prev=$(git describe --tags --match 'v*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          range="${GITHUB_SHA}"
          if [[ -n "${prev}" ]]; then range="${prev}..${GITHUB_SHA}"; fi
          {
            echo "## Changes"
            echo
            git log --first-parent --format='- %s' "${range}"
            cat <<'EOF'

          ## Arch / Manjaro

          Append to `/etc/pacman.conf` (on aarch64 the section name is `[zed-kjanat-aarch64]`):

          ```ini
          [zed-kjanat]
          SigLevel = Optional TrustAll
          Server = https://github.com/kjanat/zed-editor/releases/latest/download
          ```

          Then `sudo pacman -Syu zed-kjanat`. The package provides and conflicts with `zed`, and disables in-app auto-update: pacman owns updates.
          EOF
            if [[ -n "${prev}" ]]; then
              echo
              echo "**Full changelog**: https://github.com/${GH_REPO}/compare/${prev}...${tag}"
            fi
          } > notes.md
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "${tag}" \
            --notes-file notes.md \
            --draft \
            "${prerelease[@]}"

  bundle_linux:
    if: github.repository == 'kjanat/zed-editor' && (github.event_name == 'push' || inputs.linux)
    needs: create_draft_release
    strategy:
      fail-fast: false
      matrix: { include: [{ arch: x86_64, runner: ubuntu-latest }, { arch: aarch64, runner: ubuntu-24.04-arm }] }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions: { contents: write, id-token: write, attestations: write }
    env: { CC: "clang-18", CXX: "clang++-18", GH_REPO: "${{ github.repository }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.arch == 'x86_64'
        with: { shared-key: bundle-linux-x86_64, cache-on-failure: true }
      - name: Build as the stable release channel
        run: echo stable > crates/zed/RELEASE_CHANNEL
      - name: Bake the release version from the tag
        env: { tag: "${{ needs.create_draft_release.outputs.tag }}" }
        run: |
          if [[ "${tag}" == v[0-9]* ]]; then
            sed -i.bak "s/^version[[:space:]]*=.*/version = \"${tag#v}\"/" crates/zed/Cargo.toml
            rm crates/zed/Cargo.toml.bak
          fi
      - name: Install build dependencies
        run: ./script/linux
      - name: Install clang 18
        run: sudo apt-get install -y clang-18 lld-18
      - name: Put the LLVM 18 tools on PATH
        run: echo /usr/lib/llvm-18/bin >> "${GITHUB_PATH}"
      - name: Download WASI SDK
        run: ./script/download-wasi-sdk
      - name: Bundle
        run: ./script/bundle-linux
      - name: Attest build provenance
        if: github.event_name == 'push' || inputs.upload
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/release/zed-linux-${{ matrix.arch }}.tar.gz
            target/zed-remote-server-linux-${{ matrix.arch }}.gz
      - name: Show disk usage
        if: always()
        run: df -h /
      - name: Upload to the draft release
        if: github.event_name == 'push' || inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ needs.create_draft_release.outputs.tag }}
          arch: ${{ matrix.arch }}
        run: |
          gh release upload "${tag}" --clobber \
            "target/release/zed-linux-${arch}.tar.gz#Zed for Linux (${arch}, tar.gz)" \
            "target/zed-remote-server-linux-${arch}.gz#Zed remote server for Linux (${arch})"

  bundle_mac:
    if: github.repository == 'kjanat/zed-editor' && (github.event_name == 'push' || inputs.mac)
    needs: create_draft_release
    strategy:
      fail-fast: false
      matrix: { include: [{ arch: aarch64, target: aarch64-apple-darwin }, { arch: x86_64, target: x86_64-apple-darwin }] }
    runs-on: macos-15
    timeout-minutes: 240
    permissions: { contents: write, id-token: write, attestations: write }
    env: { GH_REPO: "${{ github.repository }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "24", check-latest: true, package-manager-cache: false }
      - name: Build as the stable release channel
        run: echo stable > crates/zed/RELEASE_CHANNEL
      - name: Bake the release version from the tag
        env: { tag: "${{ needs.create_draft_release.outputs.tag }}" }
        run: |
          if [[ "${tag}" == v[0-9]* ]]; then
            sed -i.bak "s/^version[[:space:]]*=.*/version = \"${tag#v}\"/" crates/zed/Cargo.toml
            rm crates/zed/Cargo.toml.bak
          fi
      - name: Bundle
        env: { target: "${{ matrix.target }}" }
        run: ./script/bundle-mac "${target}"
      - name: Attest build provenance
        if: github.event_name == 'push' || inputs.upload
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/${{ matrix.target }}/release/Zed-${{ matrix.arch }}.dmg
            target/zed-remote-server-macos-${{ matrix.arch }}.gz
      - name: Show disk usage
        if: always()
        run: df -h /
      - name: Upload to the draft release
        if: github.event_name == 'push' || inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ needs.create_draft_release.outputs.tag }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
        run: |
          gh release upload "${tag}" --clobber \
            "target/${target}/release/Zed-${arch}.dmg#Zed for macOS (${arch}, DMG)" \
            "target/zed-remote-server-macos-${arch}.gz#Zed remote server for macOS (${arch})"

  bundle_windows:
    if: github.repository == 'kjanat/zed-editor' && (github.event_name == 'push' || inputs.windows)
    needs: create_draft_release
    strategy: { fail-fast: false, matrix: { arch: [x86_64, aarch64] } }
    runs-on: windows-2022
    timeout-minutes: 180
    permissions: { contents: write, id-token: write, attestations: write }
    env: { ZED_WORKSPACE: "${{ github.workspace }}", GH_REPO: "${{ github.repository }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Point the Community install path at the installed edition
        shell: pwsh
        run: |
          $expected = 'C:\Program Files\Microsoft Visual Studio\2022\Community'
          if (-not (Test-Path $expected)) {
            $editions = @('Enterprise', 'Professional', 'BuildTools')
            $installed = $editions |
              ForEach-Object { "C:\Program Files\Microsoft Visual Studio\2022\$_" } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
            if (-not $installed) { throw 'No Visual Studio 2022 installation found' }
            New-Item -ItemType Junction -Path $expected -Target $installed | Out-Null
          }
      - name: Build as the stable release channel
        run: echo stable > crates/zed/RELEASE_CHANNEL
      - name: Bake the release version from the tag
        env: { tag: "${{ needs.create_draft_release.outputs.tag }}" }
        run: |
          if [[ "${tag}" == v[0-9]* ]]; then
            sed -i.bak "s/^version[[:space:]]*=.*/version = \"${tag#v}\"/" crates/zed/Cargo.toml
            rm crates/zed/Cargo.toml.bak
          fi
      - name: Resolve release version
        shell: pwsh
        run: |
          $toml = Get-Content crates/zed/Cargo.toml -Raw
          if ($toml -notmatch '(?m)^version[ \t]*=[ \t]*"([^"]+)"') {
            throw 'no version in crates/zed/Cargo.toml'
          }
          "RELEASE_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
      - name: Bundle
        shell: pwsh
        env: { arch: "${{ matrix.arch }}" }
        run: script/bundle-windows.ps1 -Architecture $env:arch
      - name: Attest build provenance
        if: github.event_name == 'push' || inputs.upload
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/Zed-${{ matrix.arch }}.exe
            target/zed-remote-server-windows-${{ matrix.arch }}.zip
      - name: Show disk usage
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
      - name: Upload to the draft release
        if: github.event_name == 'push' || inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
          arch: ${{ matrix.arch }}
          tag: ${{ needs.create_draft_release.outputs.tag }}
        run: |
          gh release upload "${tag}" --clobber \
            "target/Zed-${arch}.exe#Zed for Windows (${arch}, installer)" \
            "target/zed-remote-server-windows-${arch}.zip#Zed remote server for Windows (${arch})"

  remote_server_freebsd:
    if: github.repository == 'kjanat/zed-editor' && (github.event_name == 'push' || inputs.freebsd)
    needs: create_draft_release
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 180
    permissions: { contents: write, id-token: write, attestations: write }
    env: { GH_REPO: "${{ github.repository }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { shared-key: remote-server-freebsd, cache-on-failure: true }
      - name: Build as the stable release channel
        run: echo stable > crates/zed/RELEASE_CHANNEL
      - name: Bake the release version from the tag
        env: { tag: "${{ needs.create_draft_release.outputs.tag }}" }
        run: |
          if [[ "${tag}" == v[0-9]* ]]; then
            sed -i.bak "s/^version[[:space:]]*=.*/version = \"${tag#v}\"/" crates/zed/Cargo.toml
            rm crates/zed/Cargo.toml.bak
          fi
      - name: Install build dependencies
        run: sudo apt-get install -y clang lld llvm protobuf-compiler
      - name: Cross-compile against the FreeBSD 13.2 sysroot
        run: |
          ./script/remote-server-freebsd
          mv target/zed-remote-server-freebsd-x86_64.gz .
      # The oldest release the fork supports, so a load failure on any 13.2+
      # host shows up here.
      - name: Smoke-test the binary in a FreeBSD VM
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          release: "13.2"
          run: |
            set -ex
            gzip -dk zed-remote-server-freebsd-x86_64.gz
            chmod +x zed-remote-server-freebsd-x86_64
            ./zed-remote-server-freebsd-x86_64 version
      - name: Attest build provenance
        if: github.event_name == 'push' || inputs.upload
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: zed-remote-server-freebsd-x86_64.gz
      - name: Upload to the draft release
        if: github.event_name == 'push' || inputs.upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.create_draft_release.outputs.tag }}
        run: |
          gh release upload "${tag}" --clobber \
            "zed-remote-server-freebsd-x86_64.gz#Zed remote server for FreeBSD (x86_64)"

  bwrap_linux:
    if: github.repository == 'kjanat/zed-editor' && (github.event_name == 'push' || inputs.bwrap)
    needs: create_draft_release
    strategy:
      fail-fast: false
      matrix: { include: [{ arch: x86_64, runner: ubuntu-latest }, { arch: aarch64, runner: ubuntu-24.04-arm }] }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions: { contents: write, id-token: write, attestations: write }
    env: { GH_REPO: "${{ github.repository }}" }
    steps:
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with: { github_access_token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build static bubblewrap
        env: { arch: "${{ matrix.arch }}" }
        run: |
          nix build nixpkgs#pkgsStatic.bubblewrap -L
          cp result/bin/bwrap "bwrap-linux-${arch}"
          chmod 755 "bwrap-linux-${arch}"
          gzip -f --stdout --best "bwrap-linux-${arch}" > "bwrap-linux-${arch}.gz"
      - name: Attest build provenance
        if: github.event_name == 'push' || inputs.upload
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bwrap-linux-${{ matrix.arch }}.gz
      - name: Upload to the draft release
        if: github.event_name == 'push' || inputs.upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.create_draft_release.outputs.tag }}
          arch: ${{ matrix.arch }}
        run: |
          gh release upload "${tag}" --clobber \
            "bwrap-linux-${arch}.gz#Static bubblewrap (${arch})"

  pacman_repo:
    if: github.repository == 'kjanat/zed-editor' && !failure() && !cancelled() && startsWith(needs.create_draft_release.outputs.tag, 'v') && (github.event_name == 'push' || inputs.pacman) && (github.event_name == 'push' || inputs.upload)
    needs: [create_draft_release, bundle_linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write, id-token: write, attestations: write }
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      tag: ${{ needs.create_draft_release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install Arch packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y makepkg pacman-package-manager libarchive-tools fakeroot zstd
      - name: Download the Linux tarballs
        run: gh release download "${tag}" --pattern 'zed-linux-*.tar.gz'
      - name: Build the packages
        run: |
          version="${tag#v}"
          for arch in x86_64 aarch64; do
            build="build-${arch}"
            mkdir -p "${build}"
            sed "s/@VERSION@/${version}/" script/pacman/PKGBUILD.in > "${build}/PKGBUILD"
            cp script/pacman/zed.sh "${build}/"
            cp "zed-linux-${arch}.tar.gz" "${build}/"
            cat > "${build}/makepkg.conf" <<EOF
          if [ -f /etc/makepkg.conf ]; then source /etc/makepkg.conf; fi
          CARCH="${arch}"
          CHOST="${arch}-pc-linux-gnu"
          PKGEXT='.pkg.tar.zst'
          EOF
            (cd "${build}" && makepkg --config makepkg.conf --force --nodeps --ignorearch)
            mv "${build}"/zed-kjanat-*.pkg.tar.zst .
          done
      - name: Build the repository databases
        run: |
          repo-add zed-kjanat.db.tar.gz zed-kjanat-*-x86_64.pkg.tar.zst
          repo-add zed-kjanat-aarch64.db.tar.gz zed-kjanat-*-aarch64.pkg.tar.zst
          for link in zed-kjanat.db zed-kjanat.files zed-kjanat-aarch64.db zed-kjanat-aarch64.files; do
            target=$(readlink -f "${link}")
            rm "${link}"
            cp "${target}" "${link}"
          done
      - name: Attest build provenance
        if: github.event_name == 'push' || inputs.upload
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            zed-kjanat-*.pkg.tar.zst
            zed-kjanat.db
            zed-kjanat.files
            zed-kjanat-aarch64.db
            zed-kjanat-aarch64.files
      - name: Upload to the draft release
        if: github.event_name == 'push' || inputs.upload
        run: |
          version="${tag#v}"
          gh release upload "${tag}" --clobber \
            "zed-kjanat-${version}-1-x86_64.pkg.tar.zst#Arch/Manjaro package (x86_64)" \
            "zed-kjanat-${version}-1-aarch64.pkg.tar.zst#Arch/Manjaro package (aarch64)" \
            "zed-kjanat.db#Pacman repo database (x86_64)" \
            "zed-kjanat.files#Pacman repo file list (x86_64)" \
            "zed-kjanat-aarch64.db#Pacman repo database (aarch64)" \
            "zed-kjanat-aarch64.files#Pacman repo file list (aarch64)"

  publish:
    if: github.repository == 'kjanat/zed-editor' && !failure() && !cancelled() && (github.event_name == 'push' || (inputs.linux && inputs.mac && inputs.windows && inputs.freebsd && inputs.bwrap && inputs.pacman)) && (github.event_name == 'push' || inputs.upload)
    needs: [create_draft_release, bundle_linux, bundle_mac, bundle_windows, remote_server_freebsd, bwrap_linux, pacman_repo]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }
    env: { GH_REPO: "${{ github.repository }}", GH_TOKEN: "${{ github.token }}" }
    steps:
      - name: Take the release out of draft
        env: { tag: "${{ needs.create_draft_release.outputs.tag }}" }
        run: |
          gh release edit "${tag}" --draft=false
          gh release view "${tag}"
