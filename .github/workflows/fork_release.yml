---
name: fork_release
on:
  push: { tags: ["v*"] }
  workflow_dispatch: { inputs: { tag: { description: Tag to publish the release under, required: false, type: string } } }
permissions: { contents: read }
env: { CARGO_TERM_COLOR: always, CARGO_INCREMENTAL: 0, RUST_BACKTRACE: 1 }
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
defaults: { run: { shell: "bash -euxo pipefail {0}" } }
jobs:
  create_draft_release:
    if: github.repository == 'kjanat/zed-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }
    outputs: { tag: "${{ steps.resolve.outputs.tag }}" }
    env: { GH_REPO: "${{ github.repository }}" }
    steps:
      - name: Resolve the tag
        id: resolve
        env: { INPUT_TAG: "${{ inputs.tag }}" }
        run: |
          tag="${INPUT_TAG}"
          if [[ -z "${tag}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]];
            then tag="${GITHUB_REF_NAME}";
            else tag="dev-${GITHUB_SHA:0:7}"; fi
          fi
          echo "tag=${tag}" | tee "${GITHUB_ENV}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Create the draft release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "${tag}" >/dev/null 2>&1; then exit 0; fi
          prerelease=()
          case "${tag}" in
            v[0-9]*) ;;
            *) prerelease=(--prerelease) ;;
          esac
          prev=$(git describe --tags --match 'v*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          range="${GITHUB_SHA}"
          if [[ -n "${prev}" ]]; then range="${prev}..${GITHUB_SHA}"; fi
          {
            echo "## Changes"
            echo
            git log --first-parent --format='- %s' "${range}"
            cat <<'EOF'

          ## Arch / Manjaro

          Append to `/etc/pacman.conf` (on aarch64 the section name is `[zed-kjanat-aarch64]`):

          ```ini
          [zed-kjanat]
          SigLevel = Optional TrustAll
          Server = https://github.com/kjanat/zed-editor/releases/latest/download
          ```

          Then `sudo pacman -Syu zed-kjanat`. The package provides and conflicts with `zed`, and disables in-app auto-update: pacman owns updates.
          EOF
            if [[ -n "${prev}" ]]; then
              echo
              echo "**Full changelog**: https://github.com/${GH_REPO}/compare/${prev}...${tag}"
            fi
          } > notes.md
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "${tag}" \
            --notes-file notes.md \
            --draft \
            "${prerelease[@]}"

  bundle_linux:
    if: github.repository == 'kjanat/zed-editor'
    needs: create_draft_release
    strategy:
      fail-fast: false
      matrix: { include: [{ arch: x86_64, runner: ubuntu-latest }, { arch: aarch64, runner: ubuntu-24.04-arm }] }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions: { contents: write }
    env: { CC: "clang-18", CXX: "clang++-18", GH_REPO: "${{ github.repository }}" }
    steps:
      - name: Reclaim runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.arch == 'x86_64'
        with: { shared-key: bundle-linux-x86_64, cache-on-failure: true }
      - name: Build as the stable release channel
        run: echo stable > crates/zed/RELEASE_CHANNEL
      - name: Bake the release version from the tag
        env: { tag: "${{ needs.create_draft_release.outputs.tag }}" }
        run: |
          if [[ "${tag}" == v[0-9]* ]]; then
            sed -i.bak "s/^version[[:space:]]*=.*/version = \"${tag#v}\"/" crates/zed/Cargo.toml
            rm crates/zed/Cargo.toml.bak
          fi
      - name: Install build dependencies
        run: ./script/linux
      - name: Install clang 18
        run: sudo apt-get install -y clang-18 lld-18
      - name: Put the LLVM 18 tools on PATH
        run: echo /usr/lib/llvm-18/bin >> "${GITHUB_PATH}"
      - name: Download WASI SDK
        run: ./script/download-wasi-sdk
      - name: Bundle
        run: ./script/bundle-linux
      - name: Show disk usage
        if: always()
        run: df -h /
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ needs.create_draft_release.outputs.tag }}
          arch: ${{ matrix.arch }}
        run: |
          gh release upload "${tag}" --clobber \
            "target/release/zed-linux-${arch}.tar.gz" \
            "target/zed-remote-server-linux-${arch}.gz"

  bundle_mac:
    if: github.repository == 'kjanat/zed-editor'
    needs: create_draft_release
    strategy:
      fail-fast: false
      matrix: { include: [{ arch: aarch64, target: aarch64-apple-darwin }, { arch: x86_64, target: x86_64-apple-darwin }] }
    runs-on: macos-15
    timeout-minutes: 180
    permissions: { contents: write }
    env: { GH_REPO: "${{ github.repository }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "24", check-latest: true, package-manager-cache: false }
      - name: Build as the stable release channel
        run: echo stable > crates/zed/RELEASE_CHANNEL
      - name: Bake the release version from the tag
        env: { tag: "${{ needs.create_draft_release.outputs.tag }}" }
        run: |
          if [[ "${tag}" == v[0-9]* ]]; then
            sed -i.bak "s/^version[[:space:]]*=.*/version = \"${tag#v}\"/" crates/zed/Cargo.toml
            rm crates/zed/Cargo.toml.bak
          fi
      - name: Bundle
        env: { target: "${{ matrix.target }}" }
        run: ./script/bundle-mac "${target}"
      - name: Show disk usage
        if: always()
        run: df -h /
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ needs.create_draft_release.outputs.tag }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
        run: |
          gh release upload "${tag}" --clobber \
            "target/${target}/release/Zed-${arch}.dmg" \
            "target/zed-remote-server-macos-${arch}.gz"

  bundle_windows:
    if: github.repository == 'kjanat/zed-editor'
    needs: create_draft_release
    strategy: { fail-fast: false, matrix: { arch: [x86_64, aarch64] } }
    runs-on: windows-2022
    timeout-minutes: 180
    permissions: { contents: write }
    env: { ZED_WORKSPACE: "${{ github.workspace }}", GH_REPO: "${{ github.repository }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Point the Community install path at the installed edition
        shell: pwsh
        run: |
          $expected = 'C:\Program Files\Microsoft Visual Studio\2022\Community'
          if (-not (Test-Path $expected)) {
            $editions = @('Enterprise', 'Professional', 'BuildTools')
            $installed = $editions |
              ForEach-Object { "C:\Program Files\Microsoft Visual Studio\2022\$_" } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
            if (-not $installed) { throw 'No Visual Studio 2022 installation found' }
            New-Item -ItemType Junction -Path $expected -Target $installed | Out-Null
          }
      - name: Build as the stable release channel
        run: echo stable > crates/zed/RELEASE_CHANNEL
      - name: Bake the release version from the tag
        env: { tag: "${{ needs.create_draft_release.outputs.tag }}" }
        run: |
          if [[ "${tag}" == v[0-9]* ]]; then
            sed -i.bak "s/^version[[:space:]]*=.*/version = \"${tag#v}\"/" crates/zed/Cargo.toml
            rm crates/zed/Cargo.toml.bak
          fi
      - name: Resolve release version
        shell: pwsh
        run: |
          $toml = Get-Content crates/zed/Cargo.toml -Raw
          if ($toml -notmatch '(?m)^version[ \t]*=[ \t]*"([^"]+)"') {
            throw 'no version in crates/zed/Cargo.toml'
          }
          "RELEASE_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
      - name: Bundle
        shell: pwsh
        env: { arch: "${{ matrix.arch }}" }
        run: script/bundle-windows.ps1 -Architecture $env:arch
      - name: Show disk usage
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          arch: ${{ matrix.arch }}
          tag: ${{ needs.create_draft_release.outputs.tag }}
        run: |
          gh release upload "${tag}" --clobber \
            "target/Zed-${arch}.exe" \
            "target/zed-remote-server-windows-${arch}.zip"

  pacman_repo:
    if: github.repository == 'kjanat/zed-editor' && startsWith(needs.create_draft_release.outputs.tag, 'v')
    needs: [create_draft_release, bundle_linux]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      tag: ${{ needs.create_draft_release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install Arch packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y makepkg pacman-package-manager libarchive-tools fakeroot zstd
      - name: Download the Linux tarballs
        run: gh release download "${tag}" --pattern 'zed-linux-*.tar.gz'
      - name: Build the packages
        run: |
          version="${tag#v}"
          for arch in x86_64 aarch64; do
            build="build-${arch}"
            mkdir -p "${build}"
            sed "s/@VERSION@/${version}/" script/pacman/PKGBUILD.in > "${build}/PKGBUILD"
            cp script/pacman/zed.sh "${build}/"
            cp "zed-linux-${arch}.tar.gz" "${build}/"
            cat > "${build}/makepkg.conf" <<EOF
          if [ -f /etc/makepkg.conf ]; then source /etc/makepkg.conf; fi
          CARCH="${arch}"
          CHOST="${arch}-pc-linux-gnu"
          PKGEXT='.pkg.tar.zst'
          EOF
            (cd "${build}" && makepkg --config makepkg.conf --force --nodeps --ignorearch)
            mv "${build}"/zed-kjanat-*.pkg.tar.zst .
          done
      - name: Build the repository databases
        run: |
          repo-add zed-kjanat.db.tar.gz zed-kjanat-*-x86_64.pkg.tar.zst
          repo-add zed-kjanat-aarch64.db.tar.gz zed-kjanat-*-aarch64.pkg.tar.zst
          for link in zed-kjanat.db zed-kjanat.files zed-kjanat-aarch64.db zed-kjanat-aarch64.files; do
            target=$(readlink -f "${link}")
            rm "${link}"
            cp "${target}" "${link}"
          done
      - name: Upload to the draft release
        run: |
          gh release upload "${tag}" --clobber \
            zed-kjanat-*.pkg.tar.zst \
            zed-kjanat.db zed-kjanat.db.tar.gz \
            zed-kjanat.files zed-kjanat.files.tar.gz \
            zed-kjanat-aarch64.db zed-kjanat-aarch64.db.tar.gz \
            zed-kjanat-aarch64.files zed-kjanat-aarch64.files.tar.gz

  publish:
    if: github.repository == 'kjanat/zed-editor' && !failure() && !cancelled()
    needs: [create_draft_release, bundle_linux, bundle_mac, bundle_windows, pacman_repo]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }
    env: { GH_REPO: "${{ github.repository }}", GH_TOKEN: "${{ github.token }}" }
    steps:
      - name: Take the release out of draft
        env: { tag: "${{ needs.create_draft_release.outputs.tag }}" }
        run: |
          gh release edit "${tag}" --draft=false
          gh release view "${tag}"
